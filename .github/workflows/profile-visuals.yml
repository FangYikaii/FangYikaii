name: Generate Profile Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution heatmap
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Set PROFILE_GITHUB_TOKEN to a PAT that can read SynlysAI repositories.
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: FangYikaii
          MAX_REPOS: 300

      - name: Generate combined profile visual
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ORG: SynlysAI
          GITHUB_USERNAME: FangYikaii
          PROFILE_DIR: profile-3d-contrib
        run: python scripts/generate_profile_combined.py

      - name: Validate combined profile visual
        run: |
          python - <<'PY'
          from pathlib import Path

          profile_dir = Path("profile-3d-contrib")
          forbidden = (
              "Contribution Origin",
              "synlysai-origin-overlay",
              "profile-green-combined.svg",
          )
          required = ("Personal", "SynlysAI", "Total")
          svgs = sorted(profile_dir.glob("*.svg"))
          if not svgs:
              raise SystemExit("No profile SVG files found")
          for svg_path in svgs:
              text = svg_path.read_text(encoding="utf-8")
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f"{svg_path} missing required markers: {missing}")
              blocked = [item for item in forbidden if item in text]
              if blocked:
                  raise SystemExit(f"{svg_path} contains forbidden markers: {blocked}")
          if (profile_dir / "profile-green-combined.svg").exists():
              raise SystemExit("profile-green-combined.svg should not exist")
          print(f"Validated {len(svgs)} combined profile SVG files")
          PY

      - name: Commit generated visual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "更新 GitHub 主页 3D 热力图"
          git push
