  <path class="spark" d="M1256 238 C1264 224 1272 204 1280 176 L1280 266 L1256 266 Z" />
  <line class="axis" x1="950" y1="266" x2="1280" y2="266" opacity="0.35" />
  <text class="label" x="950" y="292">25/07</text>
  <text class="label" x="1036" y="292">25/09</text>
  <text class="label" x="1122" y="292">25/11</text>
