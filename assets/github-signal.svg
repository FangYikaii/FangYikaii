<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">GitHub current signal</title>
  <desc id="desc">Combined GitHub commit activity and profile summary for FangYikaii with consistent font sizing.</desc>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    .panel {
      fill: #ffffff;
      stroke: #d8dee4;
      stroke-width: 1;
    }

    .rule,
    .axis {
      stroke: #6e7781;
      stroke-width: 1.5;
    }

    .grid {
      stroke: #d8dee4;
      stroke-width: 1;
      stroke-dasharray: 3 5;
    }

    .label {
      fill: #57606a;
    }

    .title-text,
    .value-text {
      fill: #0969da;
      font-weight: 600;
    }

    .body-text {
      fill: #57606a;
    }

    .bar,
    .spark {
      fill: #40c463;
    }
  </style>

  <rect width="1280" height="360" fill="#ffffff" />
  <rect class="panel" x="24" y="24" width="1232" height="312" rx="8" />
  <line class="rule" x1="650" y1="48" x2="650" y2="312" opacity="0.24" />

  <text class="title-text" x="72" y="72">Commits (UTC +8.00)</text>
  <line class="axis" x1="92" y1="266" x2="562" y2="266" />
  <line class="axis" x1="92" y1="104" x2="92" y2="266" />
  <line class="grid" x1="92" y1="234" x2="562" y2="234" />
  <line class="grid" x1="92" y1="202" x2="562" y2="202" />
  <line class="grid" x1="92" y1="169" x2="562" y2="169" />
  <line class="grid" x1="92" y1="137" x2="562" y2="137" />
  <line class="grid" x1="92" y1="104" x2="562" y2="104" />

  <text class="label" x="70" y="271" text-anchor="end">0</text>
  <text class="label" x="70" y="239" text-anchor="end">2</text>
  <text class="label" x="70" y="207" text-anchor="end">4</text>
  <text class="label" x="70" y="174" text-anchor="end">6</text>
  <text class="label" x="70" y="142" text-anchor="end">8</text>
  <text class="label" x="70" y="109" text-anchor="end">10</text>

  <rect class="bar" x="260" y="120" width="18" height="146" />
  <rect class="bar" x="284" y="120" width="18" height="146" />
  <rect class="bar" x="308" y="234" width="18" height="32" />
  <rect class="bar" x="332" y="202" width="18" height="64" />
  <rect class="bar" x="356" y="88" width="18" height="178" />
  <rect class="bar" x="380" y="185" width="18" height="81" />
  <rect class="bar" x="404" y="250" width="18" height="16" />
  <rect class="bar" x="428" y="218" width="18" height="48" />
  <rect class="bar" x="452" y="185" width="18" height="81" />
  <rect class="bar" x="476" y="137" width="18" height="129" />
  <rect class="bar" x="524" y="250" width="18" height="16" />

  <text class="label" x="100" y="292" text-anchor="middle">0</text>
  <text class="label" x="220" y="292" text-anchor="middle">6</text>
  <text class="label" x="340" y="292" text-anchor="middle">12</text>
  <text class="label" x="460" y="292" text-anchor="middle">18</text>
  <text class="label" x="560" y="292" text-anchor="middle">23</text>
  <text class="label" x="500" y="318">per day hour</text>

  <text class="title-text" x="704" y="72">FangYikaii (Yikai Fang)</text>
  <text class="body-text" x="704" y="116">GitHub: 92 Contributions</text>
  <text class="body-text" x="704" y="150">Public repositories: 10</text>
  <text class="body-text" x="704" y="184">Joined GitHub: 10 years ago</text>
  <text class="body-text" x="704" y="218">Affiliation: XIAMEN UNIVERSITY</text>

