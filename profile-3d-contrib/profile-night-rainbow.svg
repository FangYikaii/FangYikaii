<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph placeholder</title>
  <desc id="desc">A neon 3D contribution graph placeholder. GitHub Actions will refresh it with live contribution data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060814"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#2D0B42"/>
    </linearGradient>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#00D8FF"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2D95"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="620" rx="20" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#8B5CF6" stroke-width="1">
    <path d="M80 520 430 145 875 405"/>
    <path d="M80 470 430 95 875 355"/>
    <path d="M80 420 430 45 875 305"/>
    <path d="M190 535 505 135M320 552 585 145M455 560 665 160M595 548 745 184"/>
  </g>
  <text x="56" y="72" fill="#F8FAFC" font-size="31" font-weight="800" font-family="JetBrains Mono, Consolas, monospace">3D CONTRIBUTION GRAPH</text>
  <text x="58" y="104" fill="#94A3B8" font-size="14" font-family="JetBrains Mono, Consolas, monospace">LIVE VERSION GENERATED BY GITHUB ACTIONS</text>
  <g transform="translate(112 145)">
    <g transform="skewY(-24)">
      <g filter="url(#glow)">
        <rect x="0" y="300" width="24" height="24" rx="3" fill="#132033"/>
        <rect x="36" y="290" width="24" height="34" rx="3" fill="#132033"/>
        <rect x="72" y="270" width="24" height="54" rx="3" fill="#00D8FF"/>
        <rect x="108" y="282" width="24" height="42" rx="3" fill="#7C3AED"/>
        <rect x="144" y="250" width="24" height="74" rx="3" fill="#FF2D95"/>
        <rect x="180" y="230" width="24" height="94" rx="3" fill="#FACC15"/>
        <rect x="216" y="300" width="24" height="24" rx="3" fill="#132033"/>
        <rect x="252" y="265" width="24" height="59" rx="3" fill="#22C55E"/>
        <rect x="288" y="205" width="24" height="119" rx="3" fill="#00D8FF"/>
        <rect x="324" y="238" width="24" height="86" rx="3" fill="#7C3AED"/>
        <rect x="360" y="288" width="24" height="36" rx="3" fill="#132033"/>
        <rect x="396" y="175" width="24" height="149" rx="3" fill="#FF2D95"/>
        <rect x="432" y="250" width="24" height="74" rx="3" fill="#FACC15"/>
        <rect x="468" y="210" width="24" height="114" rx="3" fill="#22C55E"/>
        <rect x="504" y="276" width="24" height="48" rx="3" fill="#00D8FF"/>
        <rect x="540" y="148" width="24" height="176" rx="3" fill="#FF2D95"/>
        <rect x="576" y="195" width="24" height="129" rx="3" fill="#7C3AED"/>
        <rect x="612" y="245" width="24" height="79" rx="3" fill="#FACC15"/>
        <rect x="648" y="278" width="24" height="46" rx="3" fill="#00D8FF"/>
        <rect x="684" y="225" width="24" height="99" rx="3" fill="#22C55E"/>
      </g>
    </g>
  </g>
  <text x="58" y="565" fill="#CBD5E1" font-size="14" font-family="JetBrains Mono, Consolas, monospace">Run Actions -> Generate Profile Visuals to replace this SVG with real contribution data.</text>
</svg>
